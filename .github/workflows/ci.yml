name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # prisma.config.ts resolves env('DATABASE_URL') at load time and throws if it
  # is absent, even for commands that never open the database.
  DATABASE_URL: "file:./ci.db"

jobs:
  verify:
    name: types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # An explicit version, not corepack: this project declares
      # devEngines.packageManager as a RANGE (pnpm@^11.13.0), and corepack
      # rejects ranges — it demands exact semver.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # svelte-kit sync generates .svelte-kit/tsconfig.json, which tsconfig.json
      # extends. Run explicitly rather than trusting the `prepare` lifecycle
      # hook: observed against pnpm 11.18.0 (pinned above) that pnpm does NOT
      # fire `prepare` on a fresh `install --frozen-lockfile`, so `pnpm check`
      # (and `pnpm test`, which also type-checks) would fail on a clean
      # checkout with "Cannot read file .svelte-kit/tsconfig.json". This step
      # is defensive regardless of that behaviour and is cheap either way.
      - run: pnpm exec svelte-kit sync

      # Must precede check/test/build: the SvelteKit server routes import
      # @prisma/client, and `migrate deploy` does NOT generate under Prisma 7 —
      # only `migrate dev` does.
      - run: pnpm exec prisma generate

      # Runs before the type check because it is the faster of the two and
      # catches a different class of problem; a lint failure should not wait
      # behind svelte-check to surface.
      - name: Lint
        run: pnpm lint

      # This is the step that guards the TypeScript pin. `typescript` is held at
      # ^6.0.3 because svelte-check 4.7.4 refuses TS 7; without CI running this,
      # a routine `pnpm up` would break the type check silently.
      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # svelte-kit sync generates .svelte-kit/tsconfig.json, which tsconfig.json
      # extends. Run explicitly rather than trusting the `prepare` lifecycle
      # hook: observed against pnpm 11.18.0 (pinned above) that pnpm does NOT
      # fire `prepare` on a fresh `install --frozen-lockfile`, so `pnpm check`
      # (and `pnpm test`, which also type-checks) would fail on a clean
      # checkout with "Cannot read file .svelte-kit/tsconfig.json". This step
      # is defensive regardless of that behaviour and is cheap either way.
      - run: pnpm exec svelte-kit sync

      - run: pnpm exec prisma generate

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts drives its own server: migrate deploy -> generate ->
      # seed fixture -> build -> preview, against a throwaway e2e.db.
      #
      # The suite is hermetic: matching addresses are served from seeded
      # GeocodeCache rows, and the error-path specs stub /api/search directly.
      # Nothing here touches the live Census geocoder — that dependency belongs
      # only to the describe.skip'd canary, which never runs in CI.
      - name: E2E tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  container:
    name: container builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — the image is not pushed anywhere. This exists so a change
      # that breaks the multi-stage build (a moved file, a renamed script, a
      # dependency that stops resolving under Bun) fails here rather than the
      # next time someone deploys.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: exposure-tracking-map:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A container that builds but cannot serve is not a passing build.
      - name: Smoke test the image
        run: |
          docker run -d --name etm -p 3000:3000 exposure-tracking-map:ci
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3000/; then break; fi
            sleep 1
          done
          echo "--- container logs ---"
          docker logs etm
          # No database is mounted, so / must still render and /api/sites must
          # fail cleanly rather than hanging or crashing the process.
          curl -sf -o /dev/null -w 'GET / -> %{http_code}\n' http://localhost:3000/
          status=$(curl -s -o /dev/null --max-time 10 -w '%{http_code}' http://localhost:3000/api/sites)
          echo "GET /api/sites -> ${status}"
          if [ "${status}" -lt 400 ]; then
            echo "expected /api/sites to fail cleanly (4xx/5xx) with no database mounted, got ${status}"
            exit 1
          fi
          # Re-check / to prove the process survived the /api/sites request
          # rather than hanging or crashing it.
          curl -sf --max-time 10 -o /dev/null -w 'GET / (after) -> %{http_code}\n' http://localhost:3000/
          docker rm -f etm
