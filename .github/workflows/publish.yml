name: Publish container

# The droplet at parkinsons.quinnjr.dev pulls this image by tag, so it must
# exist in the registry before `pulumi up` runs, and before any redeploy.
#
# CI's `container` job already builds the image on every push to prove the
# Dockerfile still works; it deliberately does not push. This workflow is the
# publishing half, and runs only where a push is meaningful: `main` and release
# tags.
#
# `main` is the release branch but NOT the repository's default branch — that
# is `develop`. Keep the two apart when reading this file: `is_default_branch`
# is false on every run of this workflow.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: build and push to ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # `packages: write` is the only elevation this workflow needs; everything
      # else stays read-only.
      contents: read
      packages: write
      # Lets the build publish a signed provenance attestation, so the image on
      # the droplet can be traced back to the commit that produced it.
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` tracks main and is what the droplet's default deploy pulls.
      # Version tags are what you pin to when you want a fixed release.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            # The droplet pulls `:latest`, so this tag is what a redeploy
            # actually ships. It must follow `main`, the branch this workflow
            # publishes from. It previously used `{{is_default_branch}}`, which
            # resolves against `develop` and is therefore never true here — so
            # `latest` stayed pinned to an old image, every `app-deploy` after a
            # main push reported "Image is up to date", and the droplet went on
            # serving the previous build with nothing to indicate it had.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # A private package would make the droplet's unauthenticated `docker pull`
      # fail with a 401 that reads like a missing tag, so state the requirement
      # where someone debugging that error will find it.
      - name: Remind about package visibility
        run: |
          echo "Pushed: ${{ steps.meta.outputs.tags }}"
          echo
          echo "NOTE: GitHub creates new packages PRIVATE even for a public repo."
          echo "The droplet pulls anonymously, so on the first publish only, set"
          echo "the package to public:"
          echo "  https://github.com/users/${{ github.repository_owner }}/packages/container/$(basename ${{ github.repository }})/settings"
